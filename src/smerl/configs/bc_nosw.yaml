# ABLATION (-switch_weight): one-factor change off the winner bc_logic_dec.
# skills 1,2 (normalized value). DECOUPLED skill target + logic gate kept ON;
# the ONLY change is switch_weight 20 -> 1 (no layer-1 upweighting of the skill-CE
# at switch positions). Isolates the effect of weighting the switch token heavier.
data:
  store:
    - runs/smerl_lowalpha_ckpt/trajectories_dart12
    - runs/smerl_lowalpha_ckpt/trajectories_dagger12

pattern:
  - [state, skill]
  - [skill, action]
  - value

decouple: true              # kept (as in the winner)
switch_weight: 1.0          # CHANGED: no upweighting of the skill-CE at switches
logic: true                 # kept
logic_weight: 1.0
logic_pos_weight: 50.0

model:
  n_embd: 256
  n_layer: 6
  n_head: 4
  dropout: 0.1
  n_bins: 51
  heads:
    skill: categorical
    action: disc

optim:
  epochs: 50
  batch: 64
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  val_frac: 0.1

seed: 0
device: cuda
out: runs/smerl_lowalpha_ckpt/bc_nosw.pt
