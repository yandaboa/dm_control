# Phase 1 wpe baseline (skills 1,2): same META-EPISODIC store as bc_phase1_12.yaml,
# but learned-absolute-position (wpe) + switch_share 0.4 (the wpe Phase-0 peak), so we
# can test whether RoPE's Phase-0 advantage carries over to cross-episode latching.
data:
  store:
    - runs/smerl_lowalpha_ckpt/trajectories_dart12
    - runs/smerl_lowalpha_ckpt/trajectories_dagger12_meta

pattern:
  - [state, skill]
  - [skill, action]
  - value

decouple: true
balance_switch: true
switch_share: 0.4
logic: true
logic_weight: 1.0

model:
  n_embd: 256
  n_layer: 6
  n_head: 4
  dropout: 0.1
  n_bins: 51
  heads:
    skill: categorical
    action: disc

optim:
  epochs: 50
  batch: 8
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  val_frac: 0.1

seed: 0
device: cuda
out: runs/smerl_lowalpha_ckpt/bc_phase1_12_wpe.pt
