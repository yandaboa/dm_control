# Phase 2 ros v3 round 2 — WIDENED takeover schedule (skills 0,1,2, terminate-on-
# switch). r2w store collected by bc_phase2_ros_r1 with takeover 5-100: the MINIMUM
# stays at r1's 5 (early-correction coverage retained) and only the upper bound
# grows, so the upper tail contains histories where the learner runs 1-2 sub-eps
# solo — fails and recovers on its own — before the expert may step in.
# Plain concat baseline (cf. bc_phase2_ros_r2w_wt.yaml for recency weighting).
# RoPE + bs8 + switch_share 0.4, 500 meta-eps/round.
data:
  store:
    - runs/smerl_lowalpha_ckpt/trajectories_dart012
    - runs/smerl_lowalpha_ckpt/trajectories_dagger012_meta_ros_r1_500
    - runs/smerl_lowalpha_ckpt/trajectories_dagger012_meta_ros_r2w

pattern:
  - [state, skill]
  - [skill, action]
  - value

decouple: true
balance_switch: true
switch_share: 0.4
logic: true
logic_weight: 1.0

model:
  n_embd: 256
  n_layer: 6
  n_head: 4
  dropout: 0.1
  n_bins: 51
  rope: true
  heads:
    skill: categorical
    action: disc

optim:
  epochs: 50
  batch: 8
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  val_frac: 0.1

seed: 0
device: cuda
out: runs/smerl_lowalpha_ckpt/bc_phase2_ros_r2w.pt
