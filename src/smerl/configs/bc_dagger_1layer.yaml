# Ablation arm 1 — ONE layer of class balancing: per-step skill-CE upweighting of
# the switch-decision steps (switch_weight). Action stays Gaussian-NLL, no
# modality weight. Tests whether fixing the within-skill switch dilution suffices.
data:
  store:
    - runs/smerl_lowalpha_ckpt/trajectories_multimodal_dart
    - runs/smerl_lowalpha_ckpt/trajectories_dagger

pattern:
  - [state, skill]
  - [skill, action]
  - value

switch_weight: 20.0         # layer 1 ON: upweight skill switch-decision steps 20x

model:
  n_embd: 256
  n_layer: 6
  n_head: 4
  dropout: 0.1
  heads:
    skill: categorical
    action: gaussian        # layer 2 OFF

optim:
  epochs: 50
  batch: 64
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  val_frac: 0.1

seed: 0
device: cuda
out: runs/smerl_lowalpha_ckpt/bc_dagger_1layer.pt
