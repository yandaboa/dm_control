# Phase 2 round 2 (skills 0,1,2). DART base + round-1 AND round-2 meta-episodic
# on-policy stores (round 2 driven by bc_phase2_r1). Second round of cross-episode
# coverage — the larger 3-skill history space needs more rounds (plan section 7).
data:
  store:
    - runs/smerl_lowalpha_ckpt/trajectories_dart012
    - runs/smerl_lowalpha_ckpt/trajectories_dagger012_meta_r1
    - runs/smerl_lowalpha_ckpt/trajectories_dagger012_meta_r2
    - runs/smerl_lowalpha_ckpt/trajectories_dagger012_meta_r3

pattern:
  - [state, skill]
  - [skill, action]
  - value

decouple: true
balance_switch: true
switch_share: 0.4
logic: true
logic_weight: 1.0

model:
  n_embd: 256
  n_layer: 6
  n_head: 4
  dropout: 0.1
  n_bins: 51
  rope: true
  heads:
    skill: categorical
    action: disc

optim:
  epochs: 50
  batch: 8
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  val_frac: 0.1

seed: 0
device: cuda
out: runs/smerl_lowalpha_ckpt/bc_phase2_r3.pt
