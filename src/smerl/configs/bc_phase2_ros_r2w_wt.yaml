# Phase 2 ros v3 round 2 — widened takeover (see bc_phase2_ros_r2w.yaml) PLUS
# DAgger recency weighting: each epoch samples episodes with replacement so the
# stores contribute gradient shares [0.3, 0.3, 0.4] (dart012, ros_r1_500, ros_r2w)
# regardless of store size — the newest on-policy round dominates instead of the
# 402-ep expert prior. Identical model/optim to the concat baseline.
data:
  store:
    - runs/smerl_lowalpha_ckpt/trajectories_dart012
    - runs/smerl_lowalpha_ckpt/trajectories_dagger012_meta_ros_r1_500
    - runs/smerl_lowalpha_ckpt/trajectories_dagger012_meta_ros_r2w
  store_weights: [0.3, 0.3, 0.4]

pattern:
  - [state, skill]
  - [skill, action]
  - value

decouple: true
balance_switch: true
switch_share: 0.4
logic: true
logic_weight: 1.0

model:
  n_embd: 256
  n_layer: 6
  n_head: 4
  dropout: 0.1
  n_bins: 51
  rope: true
  heads:
    skill: categorical
    action: disc

optim:
  epochs: 50
  batch: 8
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  val_frac: 0.1

seed: 0
device: cuda
out: runs/smerl_lowalpha_ckpt/bc_phase2_ros_r2w_wt.pt
