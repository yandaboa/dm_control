# DAgger iteration 1: train the multimodal transformer on the DART demos MERGED
# with the HG-DAgger intervention episodes, so the skill token learns to SWITCH
# when the value feedback stagnates.
#
# data.store is a LIST -> the datasets are concatenated (classic DAgger merge).
# Same architecture/token layout as bc_multimodal.yaml.
#
#   CUDA_VISIBLE_DEVICES=0 python -m src.smerl.train_seq \
#     --config src/smerl/configs/bc_multimodal_dagger.yaml \
#     --run-name bc_multimodal_dagger --save-every 3

data:
  store:
    - runs/smerl_lowalpha_ckpt/trajectories_multimodal_dart   # base per-skill DART demos
    - runs/smerl_lowalpha_ckpt/trajectories_dagger            # intervention episodes

pattern:
  - [state, skill]
  - [skill, action]
  - value

model:
  n_embd: 64
  n_layer: 6
  n_head: 4
  dropout: 0.1
  heads:
    skill: categorical
    action: gaussian

optim:
  epochs: 50
  batch: 64
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  val_frac: 0.1

seed: 0
device: cuda
out: runs/smerl_lowalpha_ckpt/bc_multimodal_dagger.pt
