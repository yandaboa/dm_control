# skills 1,2 (normalized value). Logic gate (pos_weight 50) + skill-head switch
# upweighting (switch_weight 20). DECOUPLED skill target. Categorical action.
data:
  store:
    - runs/smerl_lowalpha_ckpt/trajectories_dart12
    - runs/smerl_lowalpha_ckpt/trajectories_dagger12

pattern:
  - [state, skill]
  - [skill, action]
  - value

decouple: false             # skill target = coupled (executed skill)
switch_weight: 20.0         # layer-1: upweight the skill-CE at switch positions
logic: true
logic_weight: 1.0
logic_pos_weight: 50.0

model:
  n_embd: 256
  n_layer: 6
  n_head: 4
  dropout: 0.1
  n_bins: 51
  heads:
    skill: categorical
    action: disc

optim:
  epochs: 50
  batch: 64
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  val_frac: 0.1

seed: 0
device: cuda
out: runs/smerl_lowalpha_ckpt/bc_logic_coup.pt
