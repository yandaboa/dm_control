# Ablation arm 2 — TWO layers of class balancing: layer 1 (switch_weight) PLUS
# layer 2 (modality weight lifting the skill loss 8x so the action NLL doesn't
# dominate the shared backbone). Action stays Gaussian-NLL.
data:
  store:
    - runs/smerl_lowalpha_ckpt/trajectories_multimodal_dart
    - runs/smerl_lowalpha_ckpt/trajectories_dagger

pattern:
  - [state, skill]
  - [skill, action]
  - value

switch_weight: 20.0         # layer 1 ON

model:
  n_embd: 256
  n_layer: 6
  n_head: 4
  dropout: 0.1
  heads:
    skill: categorical
    action: gaussian
  loss_weights:             # layer 2 ON: lift skill so action NLL doesn't dominate
    skill: 8.0
    action: 1.0

optim:
  epochs: 50
  batch: 64
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  val_frac: 0.1

seed: 0
device: cuda
out: runs/smerl_lowalpha_ckpt/bc_dagger_2layer.pt
