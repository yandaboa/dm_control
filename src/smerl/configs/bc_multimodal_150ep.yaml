# Multimodal skill-token BC — 150-epoch run to check for undertraining.
# Identical to bc_multimodal.yaml except epochs (50 -> 150) and the output paths
# (separate model + checkpoint dir so the current bc_multimodal.pt is untouched).
#
#   CUDA_VISIBLE_DEVICES=1 python -m src.smerl.train_seq \
#     --config src/smerl/configs/bc_multimodal_150ep.yaml \
#     --run-name bc_multimodal_150ep --save-every 3

data:
  store: runs/smerl_lowalpha_ckpt/trajectories_multimodal

pattern:
  - [state, skill]
  - [skill, action]
  - value

model:
  n_embd: 64
  n_layer: 6
  n_head: 4
  dropout: 0.1
  heads:
    skill: categorical
    action: gaussian

optim:
  epochs: 150
  batch: 64
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  val_frac: 0.1

seed: 0
device: cuda
out: runs/smerl_lowalpha_ckpt/bc_multimodal_150.pt
