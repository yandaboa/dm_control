# DAgger-loop base config (template; dagger_loop overrides store/out per iteration).
# The original switching tricks (NON-NEGOTIABLE): DECOUPLED skill target + switch
# upweighting + logic gate.
data:
  store:
    - runs/smerl_lowalpha_ckpt/trajectories_dagger_iter0

pattern:
  - [state, skill]
  - [skill, action]
  - value

decouple: true
balance_switch: true   # data-driven: decision-window tokens reweighted by gradient share
switch_share: 0.2      # bs8 3-seed sweep: RoPE+0.2 best (0.993±0.002); low share fine at small batch
logic: true
logic_weight: 1.0

model:
  n_embd: 256
  n_layer: 6
  n_head: 4
  dropout: 0.1
  rope: true     # relative positions: more robust at bs8 + avoids the absolute-pos switch shortcut
  n_bins: 51
  heads:
    skill: categorical
    action: disc

optim:
  epochs: 50
  batch: 8       # Phase-0: bs8 conditions switch on failure cue (~5 steps); bs64 fires at a fixed time
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  val_frac: 0.1

seed: 0
device: cuda
out: runs/smerl_lowalpha_ckpt/bc_adapt_iter0.pt
