# Ablation arm 0 — control: bigger model (n_embd 256), decoupled targets, NO class
# balancing. Isolates the effect of capacity alone.
data:
  store:
    - runs/smerl_lowalpha_ckpt/trajectories_multimodal_dart
    - runs/smerl_lowalpha_ckpt/trajectories_dagger

pattern:
  - [state, skill]
  - [skill, action]
  - value

switch_weight: 1.0          # layer 1 OFF

model:
  n_embd: 256
  n_layer: 6
  n_head: 4
  dropout: 0.1
  heads:
    skill: categorical
    action: gaussian        # layer 2 OFF (no loss_weights)

optim:
  epochs: 50
  batch: 64
  lr: 3.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  val_frac: 0.1

seed: 0
device: cuda
out: runs/smerl_lowalpha_ckpt/bc_dagger_0layer.pt
